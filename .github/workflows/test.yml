name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test -race ./...

      # Fails on a vulnerability the code actually reaches, in a dependency or
      # in the Go standard library. The tool's version is pinned in go.mod and
      # bumped by Dependabot; the vulnerability database is fetched fresh.
      - name: Check for known vulnerabilities
        run: go tool govulncheck ./...

  # Lives here rather than in its own workflow so `needs: test` can gate it:
  # a push to main only reaches production once the tests pass.
  # See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
  deploy:
    name: Deploy app
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    # Only whether the secret is set, not the secret itself: a job-level if
    # cannot read secrets, and the token stays scoped to the deploy step.
    env:
      HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # A fork without its own token skips the deploy instead of failing.
      - run: flyctl deploy --remote-only
        if: env.HAS_FLY_TOKEN == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
