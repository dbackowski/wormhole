name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml, so a tag is released only after these same checks.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26' # same minor as the Dockerfile

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      # go test runs only part of vet; the rest (copylocks, lostcancel,
      # httpresponse, ...) needs go vet itself.
      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Run tests
        run: go test -race ./...

      # Fails on a vulnerability the code actually reaches, in a dependency or
      # in the Go standard library. The tool's version is pinned in go.mod and
      # bumped by Dependabot; the vulnerability database is fetched fresh.
      - name: Check for known vulnerabilities
        run: go tool govulncheck ./...

  # Lives here rather than in its own workflow so `needs: test` can gate it:
  # a push to main only reaches production once the tests pass.
  # See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
  #
  # Skipped when release.yml calls this workflow: github.ref is then the
  # caller's tag, not refs/heads/main, and no secrets are passed to it.
  deploy:
    name: Deploy app
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    # Only whether the secret is set, not the secret itself: a job-level if
    # cannot read secrets, and the token stays scoped to the deploy step.
    env:
      HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # A fork without its own token skips the deploy instead of failing.
      - run: flyctl deploy --remote-only
        if: env.HAS_FLY_TOKEN == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
