name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test -race ./...

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    env:
      BIN: ${{ matrix.component == 'server' && 'wormhole-server' || 'wormhole' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        component: [server, client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o $BIN cmd/${{ matrix.component }}/main.go

      - name: Create archive
        run: |
          tar -czvf wormhole-${{ matrix.component }}-linux-${{ matrix.arch }}.tar.gz $BIN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-${{ matrix.component }}-linux-${{ matrix.arch }}
          path: wormhole-${{ matrix.component }}-linux-${{ matrix.arch }}.tar.gz

  build-macos:
    needs: test
    runs-on: macos-latest
    env:
      BIN: ${{ matrix.component == 'server' && 'wormhole-server' || 'wormhole' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        component: [server, client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o $BIN cmd/${{ matrix.component }}/main.go

      - name: Create archive
        run: |
          tar -czvf wormhole-${{ matrix.component }}-darwin-${{ matrix.arch }}.tar.gz $BIN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-${{ matrix.component }}-darwin-${{ matrix.arch }}
          path: wormhole-${{ matrix.component }}-darwin-${{ matrix.arch }}.tar.gz

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec mv {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
