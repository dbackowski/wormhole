version: 2
updates:
  # Go modules, including the govulncheck tool pinned in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Actions used in .github/workflows, including the commit-pinned ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Go image the server is built on. Its PR is the cue to bump go-version
  # in the workflows too, which Dependabot does not track.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
